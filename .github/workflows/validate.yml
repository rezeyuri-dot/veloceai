name: Validate VeloceAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend
        run: python -m py_compile colab_server.py

      - name: Validate Colab notebook JSON and launch-cell Python
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path("VeloceAI_Colab.ipynb").read_text())
          cells = [c for c in notebook["cells"] if c["cell_type"] == "code"]
          assert len(cells) == 1, f"Expected one launch cell, found {len(cells)}"
          compile("".join(cells[0]["source"]), "VeloceAI_Colab_cell.py", "exec")
          print("Colab notebook JSON and Python syntax are valid.")
          PY

      - name: Validate deployment files
        run: |
          test -s Dockerfile
          test -s requirements.txt
          grep -q 'sdk: docker' README.md
          grep -q 'app_port: 7860' README.md
          grep -q 'uvicorn colab_server:app' Dockerfile

      - name: Validate frontend JavaScript and DOM references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('index.html has no inline application script');
          new Function(match[1]);
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const refs = [...new Set([...match[1].matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(m => m[1]))];
          const missing = refs.filter(id => !ids.includes(id));
          const duplicates = [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))];
          if (missing.length) throw new Error('Missing DOM IDs: ' + missing.join(', '));
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + duplicates.join(', '));
          if (!html.includes('const API_BASE=window.location.origin;')) throw new Error('Same-origin API routing missing');
          if (!match[1].includes("'/api/enhance/image'") || !match[1].includes("'/api/enhance/video'")) throw new Error('Image/video routes missing');
          console.log('Frontend JavaScript and DOM references are valid.');
          NODE
